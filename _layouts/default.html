<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafafa">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
          <span>Jędrzej Ciechanowski</span><span class="brand-muted">/ engineering</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#writing">Writing</a>
          <a href="https://github.com/0xondre">GitHub</a>
        </nav>
      </header>

      <main id="main-content">{{ content }}</main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} Jędrzej Ciechanowski</span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </footer>
    </div>
  </body>
</html>
