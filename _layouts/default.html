<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fafafa">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | normalize_whitespace | escape }}">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
          <span>Jędrzej Ciechanowski</span><span class="brand-muted">/ engineering</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}#writing">Writing</a>
          <a class="github-link" href="https://github.com/0xondre" aria-label="GitHub profile" title="GitHub profile">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 .8a11.2 11.2 0 0 0-3.54 21.83c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.75-1.32-3.75-1.32-.5-1.27-1.23-1.61-1.23-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 1.7 3.28 1.2.1-.72.4-1.2.72-1.48-2.47-.28-5.07-1.24-5.07-5.52 0-1.22.44-2.22 1.15-3-.11-.28-.5-1.42.11-2.96 0 0 .94-.3 3.08 1.14A10.8 10.8 0 0 1 12 6.04c.95 0 1.9.13 2.8.38 2.14-1.44 3.08-1.14 3.08-1.14.61 1.54.22 2.68.1 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.6 5.23-5.08 5.51.4.35.76 1.02.76 2.06v3.28c0 .3.2.65.77.54A11.2 11.2 0 0 0 12 .8Z"/></svg>
          </a>
        </nav>
      </header>

      <main id="main-content">{{ content }}</main>

      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} Jędrzej Ciechanowski</span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </footer>
    </div>
  </body>
</html>
